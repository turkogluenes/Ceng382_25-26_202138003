<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Information</title>
    <link rel="stylesheet" href="table.css">
</head>

<!-- I took some help from ChatGpt in the body part -->
<body>
    <h2>Class Information Form</h2>
    <form id="classForm">
        <input type="text" id="className" placeholder="Class Name" required>
        <input type="number" id="numPeople" placeholder="Number of People" required>
        <textarea id="description" placeholder="Description" required></textarea>
        <button type="button" id="addClass">Add Class</button>
    </form>
    
    <h2>Class List</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Class Name</th>
                <th>Number of People</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody id="classTableBody">
        </tbody>
    </table>
    
    <script src="table.js"></script>
</body>
</html>
