<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entering Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <!-- I took the logo from https://codepen.io/t_afif/pen/dyZvjqw -->
    <div class="freecodecamp"></div>

    <video id="backgroundLoop" autoplay loop muted>
        <source src="background.mp4" type="video/mp4">
    </video>

    <div id="clock"></div>

    <button id="button1"></button>
    
    <div class="register" id="registerPart">
        <h2>Enter Your Name, Surname and Password</h2>
        <form id="registerForm">
            <input type="text" id="nameSurname" placeholder="Name and Surname" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="button" id="submitButton">Submit</button>
        </form>
    </div>

    <script src="script.js"></script>

</body>
</html>
